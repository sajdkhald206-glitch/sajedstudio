:root{--black:#080808;--ink:#101012;--ink2:#141417;--crimson:#E10623;--blood:#650014;--snow:#F5F5F5;--silver:#BFC3CA;--line:rgba(191,195,202,.14);--dim:rgba(245,245,245,.66);--faint:rgba(245,245,245,.4);

img{max-width:100%;display:block}

.wrap{max-width:1480px;margin:0 auto;padding:0 var(--g)}

.b0{top:18%;inset-inline-start:-6%}.b1{top:46%;inset-inline-end:-4%}.b2{bottom:16%;inset-inline-start:2%}
.scrollcue{position:absolute;bottom:18px;inset-inline-start:var(--g);font-family:var(--f-m);font-size:9.5px;letter-spacing:.2em;color:var(--faint);display:flex;align-items:center;gap:10px}

.tl{position:relative;padding-inline-start:38px}

.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.2vw,18px)}
.client{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--ink);transition:border-color .5s,transform .7s var(--ease)}

footer{border-top:1px solid var(--line);padding:24px var(--g);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--faint);font-size:12.5px}
/* reveal defaults (JS adds motion; without JS everything is visible) */
.js .rv{opacity:0;transform:translateY(46px)}
@media (max-width:1000px){
  .hero{grid-template-columns:1fr;align-items:start;padding-top:96px;min-height:auto}
  .portrait{order:-1;min-height:min(62svh,560px);margin:0;overflow:hidden}
  .b0{max-width:calc(100% - 20px)}
  .b0{inset-inline-start:8px;top:auto;bottom:22%}.b1{inset-inline-end:8px;top:auto;bottom:8%}.b2{display:none}
  .p-img{height:94%;top:auto}
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat:nth-child(3){border-inline-end:0}
  .stat:nth-child(n+4){border-top:1px solid var(--line)}
  .sh{grid-template-columns:1fr}
  .sh>h2{position:static}
  .why,.skills,.certs{grid-template-columns:1fr 1fr}
  .cgrid{grid-template-columns:repeat(3,1fr)}
  .scrollcue{display:none}
}
@media (max-width:640px){
  .top .btn-ghost{display:none}
  .top .lang{padding:9px 12px}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:20px}
  .stat:nth-child(3){border-inline-end:1px solid var(--line)}
  .stat:nth-child(2n){border-inline-end:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .stat:last-child{grid-column:1/-1}
  .why,.skills,.certs,.proj,.duo{grid-template-columns:1fr}
  .cgrid{grid-template-columns:1fr 1fr}
  .p-badge{font-size:11px;padding:8px 10px 8px 8px}.p-badge i{width:24px;height:24px}
  .work-ph{aspect-ratio:4/3}
  .name{font-size:clamp(50px,17vw,90px)}
}
@media (prefers-reduced-motion:reduce){.grain,.p-ring svg,.dot,.marq-in,.scrollcue::after{animation:none}::view-transition-old(root),::view-transition-new(root){animation:none}}
@media print{.top,.grain,.bgfx{display:none}}
</style>
</head>
<body>
<script>document.documentElement.classList.add('js')</script>
<div class="bgfx" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<header class="top" id="top">
  <a class="logo" href="./" data-k="back" aria-label="SAJED STUDIO"><i></i><span><b>SAJED</b><small>STUDIO</small></span></a>
  <a class="btn btn-ghost" href="./#showcase" id="pf"></a>
  <button class="btn btn-ghost lang" type="button" id="lang"></button>
  <a class="btn btn-red" id="dl1" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"/></svg><span></span></a>
</header>
<main id="cv"></main>
<footer><span>© 2026 SAJED STUDIO</span><span id="foot"></span></footer>

<script src="assets/cv/cv-data.js"></script>
<script>
(()=>{
const D=window.CV, qs=new URLSearchParams(location.search);
let L=qs.get('lang'); if(L!=='ar'&&L!=='en'){try{L=localStorage.getItem('ss-lang')}catch(e){} if(L!=='ar'&&L!=='en') L=/^ar\b/i.test(navigator.language||'')?'ar':'en';}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={
 film:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>',
 motion:'<svg viewBox="0 0 24 24"><path d="M4 18c4-10 12-10 16 0"/><circle cx="12" cy="9" r="2"/><path d="M3 12h3M18 12h3"/></svg>',
 brand:'<svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>',
 social:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
 web:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
 teach:'<svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c3 2 7 2 10 0v-4.5"/></svg>'};
const ICS=['film','motion','brand','social','web','teach'];
const seal=i=>`<svg viewBox="0 0 64 64"><defs><linearGradient id="sg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b55"/><stop offset="1" stop-color="#650014"/></linearGradient></defs><path d="M32 3l6 5 8-1 3 7 7 3-1 8 5 6-5 6 1 8-7 3-3 7-8-1-6 5-6-5-8 1-3-7-7-3 1-8-5-6 5-6-1-8 7-3 3-7 8 1z" fill="url(#sg${i})"/><path d="M22 32l7 7 13-14" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function render(){
 const t=D[L], h=document.documentElement; h.lang=t.lang; h.dir=t.dir;
 document.title=L==='ar'?'ساجد سعد — السيرة الذاتية':'Sajed Saad — CV · AI Creative & Multimedia Designer';
 try{localStorage.setItem('ss-lang',L)}catch(e){}
 const pdf=`assets/cv/Sajed-Saad-CV-${L==='ar'?'AR':'EN'}.pdf`;
 const dl1=document.getElementById('dl1'); dl1.href=pdf; dl1.querySelector('span').textContent=t.dl;
 document.getElementById('lang').textContent=t.other;
 document.getElementById('pf').textContent=t.portfolio;
 document.getElementById('foot').textContent=t.location;
 const n=i=>String(i+1).padStart(2,'0');
 const sec=(id,i,title,body)=>`<section class="sec" id="${id}"><div class="wrap sh"><h2><em>${n(i)}</em>${esc(title)}</h2><div>${body}</div></div></section>`;
 const ring=(L==='ar'?'ساجد سعد • ذكاء اصطناعي • موشن • هوية • أفلام • ':'SAJED SAAD • AI CREATIVE • MOTION • BRAND • FILM • ').repeat(2);
 const marq=D.clients.map(c=>`<span>${esc(c[L][0])}</span><i>✦</i>`).join('');
 document.getElementById('cv').innerHTML=`
 <section class="hero" aria-label="${esc(t.first+' '+t.last)}">
  <div class="intro">
   <p class="kick rv">${esc(t.kicker)}</p>
   <h1 class="name" id="nm"><span class="l1">${esc(t.first)}</span><span class="l2">${esc(t.last)}</span></h1>
   <p class="role rv">${esc(t.role)}</p>
   <p class="pitch rv">${esc(t.pitch)}</p>
   <div class="meta rv"><span><i class="dot"></i>${esc(t.available)}</span><span>${esc(t.location)}</span></div>
   <div class="ctas rv"><a class="btn btn-red" href="${pdf}" download>${esc(t.dl)}</a><a class="btn btn-ghost" href="${D.links.phoneHref}" target="_blank" rel="noopener noreferrer">${esc(t.hire)}</a></div>
  </div>
  <div class="portrait" id="por" aria-hidden="true"><div class="p3d" id="p3d">
   <div class="p-glow"></div><div class="p-ring"><svg viewBox="0 0 200 200"><defs><path id="rp" d="M100,100 m-82,0 a82,82 0 1,1 164,0 a82,82 0 1,1 -164,0"/></defs><text fill="rgba(245,245,245,.7)" font-size="8.6" letter-spacing="2.4" font-family="Syncopate, Alexandria, sans-serif"><textPath href="#rp">${esc(ring)}</textPath></text></svg></div>
   <div class="p-slit"></div>
   <img class="p-img" src="assets/img/cv-portrait.webp" alt="" width="900" height="1400" fetchpriority="high">
   ${t.badges.map((b,i)=>`<div class="p-badge b${i}"><i>${['✦','◆','4'][i]}</i>${esc(b)}</div>`).join('')}
  </div></div>
  <div class="scrollcue">SCROLL</div>
 </section>
 <div class="stats">${t.stats.map(s=>`<div class="stat rv"><b dir="ltr" data-n="${s[0]}" data-s="${s[1]}">${s[0]}<em>${s[1]}</em></b><span>${esc(s[2])}</span></div>`).join('')}</div>
 ${sec('profile',0,t.h.profile,`<p class="lead" id="lead">${esc(t.profile)}</p><div class="why">${t.why.map((w,i)=>`<article class="card rv"><span class="n">${n(i)}</span><h3>${esc(w[0])}</h3><p>${esc(w[1])}</p></article>`).join('')}</div>`)}
 ${sec('skills',1,t.h.skills,`<div class="skills">${t.skills.map((s,i)=>`<article class="card rv"><div class="ico">${IC[ICS[i]]}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></article>`).join('')}</div>`)}
 ${sec('experience',2,t.h.exp,`<div class="tl" id="tl"><span class="tl-line" id="tll"></span>${t.exp.map(j=>`<article class="job rv"><div class="job-top"><h3>${esc(j.role)}</h3><span class="date">${esc(j.date)}</span></div><p class="org">${esc(j.org)} <small>· ${esc(j.place)}</small></p><ul>${j.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></article>`).join('')}</div>`)}
 <div class="marq" aria-hidden="true"><div class="marq-in">${marq}${marq}</div></div>
 ${sec('clients',3,t.h.clients,`<div class="cgrid">${D.clients.map(c=>`<article class="client rv"><figure><img loading="lazy" decoding="async" src="${c.img}" alt="${esc(c[L][0])}"></figure><div><b>${esc(c[L][0])}</b><span>${esc(c[L][1])}</span></div></article>`).join('')}</div>`)}
 ${sec('projects',4,t.h.proj,`<div class="proj">${t.proj.map(p=>`<article class="card rv"><p class="t">${esc(p[0])}</p><small>${esc(p[1])}</small><p>${esc(p[2])}</p></article>`).join('')}</div>`)}
 ${sec('certs',5,t.h.certs,`<div class="certs">${t.certs.map((c,i)=>`<article class="card cert rv"><div class="seal">${seal(i)}</div><p class="who">${esc(c[1])}</p><h3>${esc(c[0])}</h3><p>${esc(c[2])}</p></article>`).join('')}</div>`)}
 ${sec('tools',6,t.h.tools,`<div class="chips">${t.tools.map(x=>`<span class="chip rv">${esc(x)}</span>`).join('')}</div>`)}
 ${sec('edu',7,t.h.edu+' · '+t.h.lang,`<div class="duo"><div class="card rv">${t.edu.map(e=>`<div class="row"><b>${esc(e[0])}<br><small style="color:var(--dim);font-weight:400">${esc(e[1])}</small></b><span>${esc(e[2])}</span></div>`).join('')}</div><div class="card rv">${t.langs.map(e=>`<div class="row"><b>${esc(e[0])}</b><span>${esc(e[1])}</span></div>`).join('')}</div></div>
   <div class="work-ph rv"><img id="wph" loading="lazy" src="assets/img/cv-work.webp" alt=""><p>${L==='ar'?'من الفكرة <em>إلى</em> العلامة المكتملة.':'From brief <em>to</em> finished brand.'}</p></div>`)}
 <section class="final" id="contact"><div class="wrap">
  <h2 class="rv">${esc(t.h.contact)}</h2><p class="rv">${esc(t.contactLine)}</p>
  <div class="ctas rv"><a class="btn btn-red" href="${D.links.phoneHref}" target="_blank" rel="noopener noreferrer">${esc(t.hire)}</a><a class="btn btn-ghost" href="${pdf}" download>${esc(t.dl)}</a></div>
  <div class="links rv"><a href="mailto:${D.links.email}">${D.links.email}</a><a href="${D.links.phoneHref}" target="_blank" rel="noopener noreferrer" dir="ltr">${D.links.phone}</a><a href="${D.links.siteHref}">${D.links.site}</a><a href="${D.links.igHref}" target="_blank" rel="noopener noreferrer">${D.links.ig}</a></div>
 </div></section>`;
 window.dispatchEvent(new Event('cv:render'));
}
render();
document.getElementById('lang').addEventListener('click',()=>{L=L==='ar'?'en':'ar'; const u=new URL(location.href);u.searchParams.set('lang',L);history.replaceState(null,'',u);
  const go=()=>{render();};
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(go); else go();});
const top=document.getElementById('top'); addEventListener('scroll',()=>top.classList.toggle('solid',scrollY>40),{passive:true});
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
<script defer src="assets/cv/cv-motion.js"></script>
<script>(()=>{try{if(sessionStorage.getItem('ss-hit-cv'))return;sessionStorage.setItem('ss-hit-cv','1')}catch(e){}if(location.hostname==='localhost')return;try{navigator.sendBeacon('/api/hit','cv')}catch(e){}})();</script>
</body>
</html>
